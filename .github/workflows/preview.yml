name: Vercel Preview

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'Production Preview' || 'PR Preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build
        run: pnpm generate:test

      - name: Override git author for Vercel
        run: |
          git config user.email "liyd0623@gmail.com"
          git config user.name "Red-Asuka"
          git commit --allow-empty -m "deploy"

      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output
          echo '{"version": 3}' > .vercel/output/config.json
          cp -r .output/public .vercel/output/static

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Deploy to Vercel
        id: deploy
        run: |
          PROD_FLAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            PROD_FLAG="--prod"
          fi
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes $PROD_FLAG)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `**Vercel Preview:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Vercel Preview:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
